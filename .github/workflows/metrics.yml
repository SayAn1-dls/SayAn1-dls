name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SayAn1-dls
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: assets/metrics.isocalendar.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update isometric calendar"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SayAn1-dls
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          filename: assets/metrics.languages.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update language metrics"

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: SayAn1-dls
          template: classic
          base: achievements
          filename: assets/metrics.achievements.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update achievements"
